# Camera Subsystem Configuration
camera:
  default_source: 0
  resolution:
    width: 640
    height: 480
  target_fps: 30
  recognition_interval_frames: 2
  queue_size: 10
  display_overlay: true
  font_scale: 0.6
  font_thickness: 2
  colors:
    known_person: [0, 255, 0]      # Green
    unknown_person: [0, 0, 255]    # Red
    masked: [255, 255, 0]          # Cyan
    unmasked: [0, 255, 255]        # Yellow
    hud_bg: [40, 40, 40]           # Dark Gray
